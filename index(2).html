<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>15 časomier</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{padding:18px 14px;background:#111827;color:white;position:sticky;top:0;z-index:5}
h1{margin:0 0 12px;font-size:24px}.top{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:700;font-size:15px;cursor:pointer;min-height:44px}
.allstart{background:#22c55e;color:#062b12}.pause{background:#facc15}.reset{background:#e5e7eb;color:#111827}
main{max-width:1200px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:white;border:2px solid #e5e7eb;border-radius:16px;padding:14px;box-shadow:0 2px 8px #0000000d}
.card.running{border-color:#22c55e}.card.done{border-color:#ef4444}
.name{width:100%;font-size:18px;font-weight:700;padding:9px;border:1px solid #d1d5db;border-radius:9px;margin-bottom:10px}
.time{text-align:center;font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:10px 0}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.inputs label{font-size:12px;color:#6b7280}
.inputs input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}
.actions button{background:#eef2f7}.actions .go{background:#dcfce7}.status{text-align:center;font-size:12px;color:#6b7280;margin-top:7px}
@media(max-width:520px){header{position:static}.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:10px}.time{font-size:38px}.name{font-size:16px}.actions button{padding:9px 5px;font-size:13px}.top button{flex:1}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.time{font-size:48px}}
</style>
</head>
<body>
<header>
<h1>⏱️ 15 časomier</h1>
<div class="top">
<button class="allstart" id="startAll">▶ Spustiť všetky</button>
<button class="pause" id="pauseAll">⏸ Pozastaviť</button>
<button class="reset" id="resetAll">↺ Vynulovať</button>
</div>
</header>
<main><div class="grid" id="grid"></div></main>
<script>
(() => {
const timers=[];
const grid=document.getElementById('grid');
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function render(t){
 t.card.querySelector('.time').textContent=fmt(t.remaining);
 t.card.querySelector('.status').textContent=t.remaining<=0?'HOTOVO':t.running?'BEŽÍ':'Pripravená';
 t.card.classList.toggle('running',t.running);
 t.card.classList.toggle('done',t.remaining<=0);
}
function setTime(t){
 const m=Math.max(0,Math.min(999,Number(t.card.querySelector('.min').value)||0));
 const s=Math.max(0,Math.min(59,Number(t.card.querySelector('.sec').value)||0));
 t.remaining=m*60+s;t.running=false;render(t);
}
function start(t){if(t.remaining>0){t.running=true;t.last=performance.now();render(t)}}
function pause(t){t.running=false;render(t)}
function reset(t){t.running=false;t.remaining=0;render(t)}
for(let i=1;i<=15;i++){
 const t={remaining:60,running:false,last:0};
 const c=document.createElement('article');c.className='card';
 c.innerHTML=`<input class="name" value="Časomiera ${i}" aria-label="Názov časomiery ${i}">
 <div class="time">01:00</div>
 <div class="inputs">
 <label>Minúty<input class="min" type="number" min="0" max="999" value="1"></label>
 <label>Sekundy<input class="sec" type="number" min="0" max="59" value="0"></label>
 </div>
 <div class="actions"><button class="go">▶ Štart</button><button class="stop">⏸ Stop</button><button class="zero">↺ Reset</button></div>
 <div class="status">Pripravená</div>`;
 t.card=c;grid.appendChild(c);timers.push(t);
 c.querySelector('.min').addEventListener('change',()=>setTime(t));
 c.querySelector('.sec').addEventListener('change',()=>setTime(t));
 c.querySelector('.go').addEventListener('click',()=>start(t));
 c.querySelector('.stop').addEventListener('click',()=>pause(t));
 c.querySelector('.zero').addEventListener('click',()=>reset(t));
}
document.getElementById('startAll').onclick=()=>timers.forEach(start);
document.getElementById('pauseAll').onclick=()=>timers.forEach(pause);
document.getElementById('resetAll').onclick=()=>timers.forEach(reset);
function tick(now){
 for(const t of timers) if(t.running){
   t.remaining-= (now-t.last)/1000;t.last=now;
   if(t.remaining<=0){t.remaining=0;t.running=false}
   render(t);
 }
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
